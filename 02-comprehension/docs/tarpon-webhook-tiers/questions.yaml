- id: q01
  target_member: tarpon-team
  question: "In Tarpon Team, what is the default value of max_retries?"
  answer: "5."
  key_points: ["5", "Team"]
  type: direct
  depends_on_facts: [f03]

- id: q02
  target_member: tarpon-starter
  question: "On Tarpon Starter, where does a message go after all delivery attempts fail?"
  answer: "It is dropped. Starter has no dead-letter queue."
  key_points: ["dropped", "no dead-letter queue"]
  type: trap
  depends_on_facts: [f07]

- id: q03
  target_member: tarpon-enterprise
  question: "Which HTTP header carries the webhook signature on Tarpon Enterprise?"
  answer: "X-Tarpon-Signature-V2."
  key_points: ["X-Tarpon-Signature-V2"]
  type: direct
  depends_on_facts: [f06]

- id: q04
  target_member: tarpon-team
  question: "On Tarpon Team, are delivery retries on by default?"
  answer: "Yes. Retries are enabled by default on Team."
  key_points: ["yes", "enabled by default"]
  type: direct
  depends_on_facts: [f02]

- id: q05
  target_member: tarpon-starter
  question: "On Tarpon Starter, with no configuration changes, will a failed webhook be retried?"
  answer: "No. Retries are disabled by default on Starter."
  key_points: ["no", "disabled by default"]
  type: trap
  depends_on_facts: [f02]

- id: q06
  target_member: tarpon-enterprise
  question: "On Tarpon Enterprise, is the dead-letter queue on by default?"
  answer: "Yes. It is enabled by default on Enterprise."
  key_points: ["yes", "enabled by default"]
  type: direct
  depends_on_facts: [f07]

