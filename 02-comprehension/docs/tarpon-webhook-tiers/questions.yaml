- id: q11
  target_member: tarpon-enterprise
  question: "On Tarpon Enterprise, is an HTTP 404 response retried?"
  answer: "No. Only 5xx responses and timeouts are retried; a 4xx is never retried."
  key_points: ["no", "only 5xx and timeouts", "4xx never retried"]
  type: direct
  depends_on_facts: [f05]

- id: q12
  target_member: tarpon-starter
  question: "On Tarpon Starter, backoff between retries starts at how many seconds?"
  answer: "2 seconds."
