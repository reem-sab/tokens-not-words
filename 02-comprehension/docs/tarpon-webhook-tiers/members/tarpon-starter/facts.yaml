- id: f01
  fact: "The default per-attempt delivery timeout is 10 seconds."
- id: f02
  fact: "Retries are disabled by default."
- id: f03
  fact: "When retries are enabled, max_retries defaults to 3, counting attempts after the first."
- id: f04
  fact: "Backoff between retries is exponential, starting at 2 seconds."
- id: f05
  fact: "Only 5xx responses and timeouts are retried; a 4xx response is final and is never retried."
- id: f06
  fact: "Webhooks are signed with HMAC-SHA256, sent in the X-Tarpon-Signature header."
- id: f07
  fact: "Starter has no dead-letter queue. After the final attempt fails, the message is dropped."
- id: f08
  fact: "The maximum webhook payload size is 256 KB."
