versions:
  - name: original
    description: >
      Baseline docs as first written. Each tier is documented on its own, with no
      explicit labels calling out which settings are tier-specific.
  - name: differentiated
    description: >
      Each tier's distinguishing settings are labeled as tier-specific (for
      example "Team default"). Same facts as the original; only the labeling
      changes. It does not state any sibling tier's specific values.
