set_id: tarpon-webhook-tiers
title: Tarpon webhook delivery (three tiers)
description: >
  A fictional placeholder set. Three service tiers of an invented product,
  "Tarpon", whose webhook delivery configuration is similar but differs in
  specific defaults. Loaded together, they test whether a model keeps the tiers
  straight rather than blending their settings. Written for this repo to exercise
  the schema and pipeline before a real set is chosen.
covers: Webhook delivery configuration and its default values.
how_members_differ: >
  Each tier changes a set of defaults: per-attempt timeout, whether retries are on
  by default, the default max_retries, dead-letter queue availability, maximum
  payload size, and (on the top tier) the signature header name. Backoff and the
  retry policy for status codes are the same across all tiers.

